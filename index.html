<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ALBA FERNÁNDEZ VÁZQUEZ</title>
    <style>
        /* Estilos base con estética Stradivarius */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: #ff69b4; /* Fondo rosa solicitado */
            color: #ffffff;            /* Texto blanco solicitado */
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            text-align: center;
            padding: 60px 20px;
            letter-spacing: 1.5px;
        }

        a, a:visited {
            color: #ffffff;
        }

        /* Encabezados minimalistas estilo moda */
        h1 {
            font-size: 2.2rem;
            font-weight: 700;
            text-transform: uppercase;
            margin-bottom: 8px;
            letter-spacing: 4px;
        }

        h2 {
            font-size: 0.95rem;
            font-weight: 400;
            text-transform: uppercase;
            margin-bottom: 50px;
            letter-spacing: 3px;
            opacity: 0.9;
        }

        /* Contenedor del vídeo adaptativo (responsive) */
        .video-container {
            max-width: 900px;
            margin: 0 auto;
            position: relative;
            padding-bottom: 56.25%; /* Relación de aspecto 16:9 */
            height: 0;
            overflow: hidden;
            border-radius: 4px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.15);
        }

        .video-container iframe {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border: none;
        }
    </style>
</head>
<body>

    <!-- Cabecera -->
    <header>
        <h1>BIENVENIDO</h1>
        <h2>ALBA FERNÁNDEZ VÁZQUEZ</h2>
    </header>

    <!-- Vídeo al final -->
    <main>
        <div class="video-container">
            <iframe 
                src="https://www.youtube.com/embed/pbDZrEpknWA" 
                title="Reproductor de vídeo de YouTube" 
                allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" 
                allowfullscreen>
            </iframe>
        </div>
    </main>

</body>
</html>
